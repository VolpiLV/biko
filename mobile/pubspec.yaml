name: biko_mobile
description: Aplicativo móvel do Biko - marketplace de serviços (Projeto Integrador).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.0
  flutter_secure_storage: ^11.1.1
  go_router: ^17.5.0
  provider: ^6.1.5
  shared_preferences: ^2.5.5
  image_picker: ^1.2.4
  # Abre a rota no Google Maps e o discador do telefone.
  url_launcher: ^6.3.1
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^23.0.4
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Fonte do protótipo do Figma (Poppins, licença OFL em assets/fonts/OFL.txt).
  # Fica dentro do app: funciona sem internet.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
